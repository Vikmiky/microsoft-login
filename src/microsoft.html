<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="/TAILWIND/src/micro.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div class=" flex justify-center items-center mt-35 " >
        <div class="flex flex-col bg- border-2 w-120 p-10 h-90 shadow">
            <img class="w-30 mt-0" src="/img/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg" width="50px" alt="">
             <h3 class="text-2xl mt-3 font-medium">Sign in</h3>
        <p class="text-sm text-[#1b1b1b]">to continue to Microsoft Azure</p>
        <form class="mt-2 w-30" action="text">
            <input class="w-103 h-10 border-b border-black outline-0" type="text" name="" placeholder="Email, phone, or Skype">
        </form>
        <div class="flex mt-3 gap-1.5 text-sm"><p class="text-[#1b1b1b]">No account?</p><span><a class="text-blue-600 hover:underline hover:text-[#5b1e048e]" href="#">Create one!</a></span></div>
        <div class="mt-3.5 text-blue-600 text-sm hover:underline hover:text-[#5b1e048e]">
            <a href="#">Can't access your account?</a>
        </div>


        <button class=" self-end bg-[#0067b8] block border-[#0067b8] w-27 h-8 text-white text-center"><a class="" href="#">Next</a></button>
        </div>
       

    </div>

    <div class=" flex justify-center items-center mt-6 mb-5">
        <div class="flex flex-col bg- border-2 w-120 p- h-25 shadow">
            <div class="justify-center m-2 ml-9"><i class="ri-key-2-fill text-2xl "></i>
            <span class="p-2 text-[#1b1b1b]">Sign-in options</span></div>

            <div class="flex p-3 ml-3.5 ml-5 mt-0"><img src="/img/signin-github_cd1de9b83dfe6a0119008f5aa0a1df2d.svg" alt=""> <span class="p-2 text-[#1b1b1b]">Sign in with GitHub</span></div>
        </div>

        

    </div>
</body>
</html>
